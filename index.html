<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, height=device-height">
    <title>SYNQ · Private Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { 
            background: #0F172A; 
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Full height flex container */
        .chat-container {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Messages area  */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }
        
        /* Input area - FIXED AT BOTTOM */
        .input-area {
            background: #0F172A;
            border-top: 1px solid #334155;
            padding: 12px 16px;
            flex-shrink: 0;
        }
        
        /* Message bubbles */
        .sent-bubble { 
            background: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%); 
            border-radius: 18px 18px 0 18px; 
        }
        .received-bubble { 
            background: #334155; 
            border-radius: 18px 18px 18px 0; 
        }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1E293B; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .typing-dot { 
            animation: blink 1.2s infinite; 
            display: inline-block; 
            width: 6px; 
            height: 6px; 
            background: #94A3B8; 
            border-radius: 50%; 
            margin: 0 1px; 
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }
        
        .status-online { background-color: #22C55E; box-shadow: 0 0 8px #22C55E; }
        .status-offline { background-color: #64748B; }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 200;
            animation: fadeInOut 2s ease;
            white-space: nowrap;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        button { cursor: pointer; }
        input, textarea { outline: none; }
    </style>
</head>
<body>

<div id="app" class="chat-container">
    <!-- Setup Panel -->
    <div id="setupPanel" class="flex-1 flex flex-col items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-md w-full">
            <div class="text-center mb-8">
                <div class="text-4xl font-bold bg-gradient-to-r from-[#14B8A6] to-[#8B5CF6] bg-clip-text text-transparent">SYNQ</div>
                <p class="text-gray-400 text-sm mt-1">Private · Encrypted · No login</p>
            </div>
            
            <div class="bg-[#1E293B] rounded-2xl border border-[#334155] p-6">
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button id="createRoomBtn" class="py-3 bg-[#14B8A6] hover:bg-[#0D9488] rounded-xl transition font-medium">Create Room</button>
                    <button id="joinRoomBtn" class="py-3 bg-[#8B5CF6] hover:bg-[#7C3AED] rounded-xl transition font-medium">Join Room</button>
                </div>
                
                <div id="createArea" class="hidden">
                    <div class="text-center">
                        <div class="text-emerald-400 mb-2">Your Room Code</div>
                        <div class="bg-[#0F172A] p-4 rounded-xl mb-3">
                            <span id="roomCodeDisplay" class="text-2xl font-mono tracking-wider font-bold"></span>
                        </div>
                        <button id="copyRoomCodeBtn" class="w-full py-2 bg-[#334155] hover:bg-[#475569] rounded-lg transition">Copy Code</button>
                        <div class="text-xs text-gray-500 mt-3">Send this code to your friend</div>
                        <div id="waitingMessage" class="mt-4 text-yellow-400 text-sm">⏳ Waiting for friend to join...</div>
                    </div>
                </div>
                
                <div id="joinArea" class="hidden">
                    <input type="text" id="joinCodeInput" placeholder="Enter code" class="w-full bg-[#0F172A] border border-[#334155] rounded-xl p-3 text-center text-xl font-mono tracking-wider uppercase mb-3">
                    <button id="doJoinBtn" class="w-full py-3 bg-[#8B5CF6] hover:bg-[#7C3AED] rounded-xl transition font-medium">Join Room</button>
                </div>
            </div>
            
            <div class="text-center text-xs text-gray-500 mt-6">
                🔒 End-to-end encrypted · No servers except Firebase
            </div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div id="chatPanel" class="hidden flex-1 flex-col" style="height: 100vh; height: 100dvh;">
        <!-- Header - fixed at top -->
        <div class="bg-[#1E293B] px-4 py-3 flex items-center justify-between border-b border-[#334155] flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#14B8A6] to-[#0D9488] flex items-center justify-center font-bold text-lg">F</div>
                <div>
                    <div class="font-semibold">Friend</div>
                    <div class="flex items-center gap-1">
                        <span id="statusDot" class="w-2 h-2 rounded-full status-offline"></span>
                        <span id="statusText" class="text-xs text-gray-400">Connecting...</span>
                    </div>
                </div>
            </div>
            <button id="leaveRoomBtn" class="text-gray-400 hover:text-red-400 transition px-2">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
        
        <!-- Messages - scrollable area -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto custom-scroll px-4 py-3 space-y-2"></div>
        
        <!-- Typing indicator -->
        <div id="typingIndicator" class="hidden px-4 py-1 text-xs text-gray-400 italic flex-shrink-0">
            Friend is typing<span class="typing-dot ml-0.5"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>
        
        <!-- Input area - FIXED AT BOTTOM -->
        <div class="input-area">
            <div class="flex items-center gap-2">
                <button id="emojiBtn" class="text-2xl text-gray-400 hover:text-white transition px-2">😊</button>
                <button id="imageBtn" class="text-xl text-gray-400 hover:text-white transition px-2"><i class="fas fa-image"></i></button>
                <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-[#1E293B] border border-[#334155] rounded-full px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-[#14B8A6] text-white">
                <button id="sendBtn" class="bg-gradient-to-r from-[#14B8A6] to-[#0D9488] w-10 h-10 rounded-full flex items-center justify-center transition active:scale-95">
                    <i class="fas fa-paper-plane text-white text-sm"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCCz8lhH2fpNsmiByD7p8CKavsoO89zfQk",
        authDomain: "synq-2f6e7.firebaseapp.com",
        projectId: "synq-2f6e7",
        storageBucket: "synq-2f6e7.firebasestorage.app",
        messagingSenderId: "117419374371",
        appId: "1:117419374371:web:159eaf7981c5565b6abe96"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentRoom = null;
    let myId = Math.random().toString(36).substring(2, 8);
    let messages = [];
    let messageListener = null;
    let typingListener = null;
    let joinListener = null;
    let typingTimeout = null;
    let isCurrentlyTyping = false;
    let hasEnteredChat = false;  // Prevent duplicate entry
    
    const setupPanel = document.getElementById('setupPanel');
    const chatPanel = document.getElementById('chatPanel');
    const messagesContainer = document.getElementById('messagesContainer');
    
    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function scrollToBottom() {
        if (messagesContainer) {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function renderMessages() {
        if (!messagesContainer) return;
        
        if (messages.length === 0) {
            messagesContainer.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-500 text-center"><i class="fas fa-comment-dots text-3xl mb-2 opacity-30"></i><p>No messages yet.<br>Say hello to your friend!</p></div>';
            return;
        }
        
        let html = '';
        for (let i = 0; i < messages.length; i++) {
            const msg = messages[i];
            if (msg.isImage && msg.imageData) {
                if (msg.sent) {
                    html += '<div class="flex justify-end mb-2"><div class="max-w-[75%] sent-bubble p-2"><img src="' + msg.imageData + '" class="rounded-lg max-h-48 object-cover cursor-pointer" onclick="window.open(this.src)"/><div class="text-right text-[10px] text-white/60 mt-1">' + escapeHtml(msg.time) + '</div></div></div>';
                } else {
                    html += '<div class="flex justify-start mb-2"><div class="max-w-[75%] received-bubble p-2"><img src="' + msg.imageData + '" class="rounded-lg max-h-48 object-cover cursor-pointer" onclick="window.open(this.src)"/><div class="text-left text-[10px] text-gray-400 mt-1">' + escapeHtml(msg.time) + '</div></div></div>';
                }
            } else {
                if (msg.sent) {
                    html += '<div class="flex justify-end mb-2"><div class="max-w-[75%] sent-bubble px-4 py-2"><p class="text-white break-words">' + escapeHtml(msg.text) + '</p><div class="text-right text-[10px] text-white/60 mt-1">' + escapeHtml(msg.time) + '</div></div></div>';
                } else {
                    html += '<div class="flex justify-start mb-2"><div class="max-w-[75%] received-bubble px-4 py-2"><p class="text-gray-100 break-words">' + escapeHtml(msg.text) + '</p><div class="text-left text-[10px] text-gray-400 mt-1">' + escapeHtml(msg.time) + '</div></div></div>';
                }
            }
        }
        messagesContainer.innerHTML = html;
        scrollToBottom();
    }
    
    function addMessageToUI(text, isSent, isImage, imageData, timestamp) {
        const msg = {
            id: Date.now() + Math.random(),
            text: text || (isImage ? "📷 Image" : ""),
            sent: isSent,
            time: timestamp || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            isImage: isImage || false,
            imageData: imageData || null
        };
        messages.push(msg);
        renderMessages();
        
        if (currentRoom && isSent) {
            db.ref('rooms/' + currentRoom + '/messages').push({
                id: msg.id,
                text: msg.text,
                sentBy: myId,
                isImage: msg.isImage,
                imageData: msg.imageData,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }
    }
    
    function sendMessage(text, isImage, imageData) {
        isImage = isImage || false;
        if (!currentRoom) {
            showToast("Not connected to a room");
            return;
        }
        addMessageToUI(text, true, isImage, imageData, null);
        sendTyping(false);
    }
    
    function sendTyping(isTyping) {
        if (currentRoom && isCurrentlyTyping !== isTyping) {
            isCurrentlyTyping = isTyping;
            db.ref('rooms/' + currentRoom + '/typing/' + myId).set(isTyping ? true : null);
        }
    }
    
    function showTyping(show) {
        const el = document.getElementById('typingIndicator');
        if (el) el.style.display = show ? 'flex' : 'none';
    }
    
    function setConnected(connected) {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        if (dot) dot.className = 'w-2 h-2 rounded-full ' + (connected ? 'status-online' : 'status-offline');
        if (text) text.innerText = connected ? 'Online' : 'Connecting...';
    }
    
    function cleanupListeners() {
        if (messageListener) { messageListener.off(); messageListener = null; }
        if (typingListener) { typingListener.off(); typingListener = null; }
        if (joinListener) { joinListener.off(); joinListener = null; }
    }
    
    function loadExistingMessages(roomId) {
        return db.ref('rooms/' + roomId + '/messages').once('value').then((snap) => {
            const msgs = snap.val();
            if (msgs) {
                const msgList = [];
                for (let key in msgs) {
                    if (msgs.hasOwnProperty(key)) {
                        msgList.push(msgs[key]);
                    }
                }
                msgList.sort(function(a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });
                for (let i = 0; i < msgList.length; i++) {
                    const msg = msgList[i];
                    if (!messages.find(function(m) { return m.id === msg.id; })) {
                        messages.push({
                            id: msg.id,
                            text: msg.text,
                            sent: msg.sentBy === myId,
                            time: new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            isImage: msg.isImage || false,
                            imageData: msg.imageData
                        });
                    }
                }
                renderMessages();
            }
        });
    }
    
    function setupMessageListener(roomId) {
        if (messageListener) messageListener.off();
        messageListener = db.ref('rooms/' + roomId + '/messages').limitToLast(50);
        messageListener.on('child_added', function(snap) {
            const msg = snap.val();
            if (msg.sentBy !== myId && !messages.find(function(m) { return m.id === msg.id; })) {
                messages.push({
                    id: msg.id,
                    text: msg.text,
                    sent: false,
                    time: new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    isImage: msg.isImage || false,
                    imageData: msg.imageData
                });
                renderMessages();
                if (document.hidden && Notification.permission === 'granted') {
                    new Notification("SYNQ", { body: (msg.text || "📷 Image").slice(0, 50) });
                }
            }
        });
    }
    
    function setupTypingListener(roomId) {
        if (typingListener) typingListener.off();
        typingListener = db.ref('rooms/' + roomId + '/typing');
        typingListener.on('value', function(snap) {
            const typing = snap.val();
            let someoneTyping = false;
            if (typing) {
                for (let id in typing) {
                    if (typing.hasOwnProperty(id) && id !== myId && typing[id] === true) {
                        someoneTyping = true;
                        break;
                    }
                }
            }
            showTyping(someoneTyping);
        });
    }
    
    function enterChat(roomId) {
        if (hasEnteredChat) return;
        hasEnteredChat = true;
        
        currentRoom = roomId;
        messages = [];
        cleanupListeners();
        
        setupPanel.classList.add('hidden');
        chatPanel.classList.remove('hidden');
        setConnected(true);
        
        setTimeout(function() {
            document.getElementById('messageInput').focus();
        }, 200);
        
        loadExistingMessages(roomId).then(function() {
            setupMessageListener(roomId);
            setupTypingListener(roomId);
        });
    }
    
    function generateRoomCode() {
        return Math.random().toString(36).substring(2, 10).toUpperCase();
    }
    
    // ========== CREATE ROOM  ==========
    document.getElementById('createRoomBtn').onclick = function() {
        const roomCode = generateRoomCode();
        document.getElementById('roomCodeDisplay').innerText = roomCode;
        document.getElementById('createArea').classList.remove('hidden');
        document.getElementById('joinArea').classList.add('hidden');
        document.getElementById('waitingMessage').innerHTML = '⏳ Waiting for friend to join...';
        hasEnteredChat = false;
        
        // First, check if room already has a joiner (unlikely but possible)
        db.ref('rooms/' + roomCode).once('value').then(function(snap) {
            if (!snap.exists()) {
                return db.ref('rooms/' + roomCode).set({
                    created: firebase.database.ServerValue.TIMESTAMP,
                    creator: myId,
                    createdAt: Date.now()
                });
            }
        }).then(function() {
            showToast("Room created! Share the code with your friend");
            
            // Set up listener for joiner
            if (joinListener) joinListener.off();
            joinListener = db.ref('rooms/' + roomCode + '/joiner').on('value', function(snap) {
                const joinerId = snap.val();
                if (joinerId && joinerId !== myId && !hasEnteredChat) {
                    document.getElementById('waitingMessage').innerHTML = '✅ Friend joined! Entering chat...';
                    showToast("Friend joined! Entering chat...");
                    if (joinListener) joinListener.off();
                    enterChat(roomCode);
                }
            });
            
            // Also check immediately if joiner already exists
            db.ref('rooms/' + roomCode + '/joiner').once('value', function(snap) {
                if (snap.val() && snap.val() !== myId && !hasEnteredChat) {
                    document.getElementById('waitingMessage').innerHTML = '✅ Friend already joined! Entering chat...';
                    if (joinListener) joinListener.off();
                    enterChat(roomCode);
                }
            });
        }).catch(function(err) {
            showToast("Error: " + err.message);
        });
    };
    
    document.getElementById('copyRoomCodeBtn').onclick = function() {
        const code = document.getElementById('roomCodeDisplay').innerText;
        if (code) {
            navigator.clipboard.writeText(code);
            showToast("Code copied!");
        }
    };
    
    // Join Room
    document.getElementById('joinRoomBtn').onclick = function() {
        document.getElementById('joinArea').classList.remove('hidden');
        document.getElementById('createArea').classList.add('hidden');
        hasEnteredChat = false;
    };
    
    document.getElementById('doJoinBtn').onclick = function() {
        const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
        if (!code) {
            showToast("Enter a room code");
            return;
        }
        
        db.ref('rooms/' + code).once('value').then(function(snap) {
            if (!snap.exists()) {
                throw new Error("Room not found");
            }
            return db.ref('rooms/' + code + '/joiner').set(myId).then(function() {
                return code;
            });
        }).then(function(roomCode) {
            showToast("Joined room!");
            enterChat(roomCode);
        }).catch(function(err) {
            if (err.message === "Room not found") {
                showToast("Room not found. Check the code.");
            } else {
                showToast("Error: " + err.message);
            }
        });
    };
    
    document.getElementById('leaveRoomBtn').onclick = function() {
        if (confirm("Leave the room?")) {
            cleanupListeners();
            if (currentRoom) {
                db.ref('rooms/' + currentRoom + '/typing/' + myId).set(null);
            }
            location.reload();
        }
    };
    
    document.getElementById('sendBtn').onclick = function() {
        const input = document.getElementById('messageInput');
        if (input.value.trim()) {
            sendMessage(input.value.trim(), false, null);
            input.value = '';
        }
    };
    
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('sendBtn').click();
        }
    });
    
    document.getElementById('messageInput').addEventListener('input', function() {
        sendTyping(true);
        if (typingTimeout) clearTimeout(typingTimeout);
        typingTimeout = setTimeout(function() {
            sendTyping(false);
        }, 1500);
    });
    
    // Emoji picker
    let emojiPickerDiv = null;
    document.getElementById('emojiBtn').onclick = function(e) {
        e.stopPropagation();
        if (emojiPickerDiv) {
            emojiPickerDiv.remove();
            emojiPickerDiv = null;
            return;
        }
        emojiPickerDiv = document.createElement('div');
        emojiPickerDiv.className = 'fixed bottom-20 left-4 bg-[#1E293B] border border-[#334155] rounded-xl p-2 grid grid-cols-7 gap-1 z-50';
        const emojis = ['😊','😂','❤️','🔥','👍','🎉','😢','😎','🤔','👀','✅','💯','✨','🌟','🥳','😍','💪','👏','🚀','🎈'];
        for (let i = 0; i < emojis.length; i++) {
            const btn = document.createElement('button');
            btn.textContent = emojis[i];
            btn.className = 'p-2 hover:bg-[#334155] rounded-lg text-xl';
            btn.onclick = function(e) {
                e.stopPropagation();
                document.getElementById('messageInput').value += emojis[i];
                if (emojiPickerDiv) emojiPickerDiv.remove();
                emojiPickerDiv = null;
                document.getElementById('messageInput').focus();
            };
            emojiPickerDiv.appendChild(btn);
        }
        document.body.appendChild(emojiPickerDiv);
    };
    
    document.addEventListener('click', function(e) {
        const emojiBtn = document.getElementById('emojiBtn');
        if (emojiPickerDiv && !emojiPickerDiv.contains(e.target) && e.target !== emojiBtn) {
            emojiPickerDiv.remove();
            emojiPickerDiv = null;
        }
    });
    
    document.getElementById('imageBtn').onclick = function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (file && file.size < 2 * 1024 * 1024) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    sendMessage("", true, ev.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                showToast("Image too large (max 2MB)");
            }
        };
        input.click();
    };
    
    if (Notification.permission === 'default') {
        setTimeout(function() {
            Notification.requestPermission();
        }, 1000);
    }
</script>
</body>
</html>
