<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>SYNQ · Private Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0F172A; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        
        #setupPanel {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
        }
        
        #chatPanel {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            flex-shrink: 0;
            background: #1E293B;
            border-bottom: 1px solid #334155;
            padding: 12px 16px;
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .input-area {
            flex-shrink: 0;
            background: #0F172A;
            border-top: 1px solid #334155;
            padding: 12px 16px;
        }
        
        .sent-bubble { 
            background: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%); 
            border-radius: 18px 18px 0 18px; 
            position: relative;
        }
        .received-bubble { 
            background: #334155; 
            border-radius: 18px 18px 18px 0; 
        }
        
        /* Message actions (edit/delete) - appears on hover */
        .message-actions {
            position: absolute;
            top: -28px;
            right: 0;
            background: #1E293B;
            border-radius: 20px;
            padding: 4px 10px;
            gap: 12px;
            display: none;
            z-index: 10;
            border: 1px solid #334155;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .message-wrapper:hover .message-actions {
            display: flex;
        }
        .message-actions button {
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .message-actions button:hover {
            background: #334155;
            color: white;
        }
        
        /* Image styles */
        .chat-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
            margin: 4px 0;
            object-fit: cover;
        }
        .chat-image:hover {
            opacity: 0.9;
        }
        
        /* Image preview modal */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1E293B; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .status-online { background-color: #22C55E; }
        .status-offline { background-color: #64748B; }
        
        .status-icons {
            font-size: 10px;
            margin-left: 6px;
        }
        .status-sent { color: #94A3B8; }
        .status-delivered { color: #14B8A6; }
        .status-read { color: #22C55E; }
        .edited-badge { font-size: 9px; color: #94A3B8; margin-left: 6px; }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 200;
            animation: fadeInOut 2s ease;
            white-space: nowrap;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        button { cursor: pointer; }
        input { outline: none; }
    </style>
</head>
<body>

<div id="setupPanel">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="text-4xl font-bold bg-gradient-to-r from-[#14B8A6] to-[#8B5CF6] bg-clip-text text-transparent">SYNQ</div>
            <p class="text-gray-400 text-sm mt-1">Private · Encrypted · No login</p>
        </div>
        
        <div class="bg-[#1E293B] rounded-2xl border border-[#334155] p-6">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button id="createRoomBtn" class="py-3 bg-[#14B8A6] hover:bg-[#0D9488] rounded-xl transition font-medium">Create Room</button>
                <button id="joinRoomBtn" class="py-3 bg-[#8B5CF6] hover:bg-[#7C3AED] rounded-xl transition font-medium">Join Room</button>
            </div>
            
            <div id="createArea" class="hidden">
                <div class="text-center">
                    <div class="text-emerald-400 mb-2">✨ Your Room Code</div>
                    <div class="bg-[#0F172A] p-4 rounded-xl mb-3">
                        <span id="roomCodeDisplay" class="text-2xl font-mono tracking-wider font-bold"></span>
                    </div>
                    <button id="copyRoomCodeBtn" class="w-full py-2 bg-[#334155] hover:bg-[#475569] rounded-lg transition">Copy Code</button>
                    <div class="text-xs text-gray-500 mt-3">Send this code to your friend</div>
                    <div id="waitingMessage" class="mt-4 text-yellow-400 text-sm">⏳ Waiting for friend to join...</div>
                </div>
            </div>
            
            <div id="joinArea" class="hidden">
                <input type="text" id="joinCodeInput" placeholder="Enter code" class="w-full bg-[#0F172A] border border-[#334155] rounded-xl p-3 text-center text-xl font-mono tracking-wider uppercase mb-3">
                <button id="doJoinBtn" class="w-full py-3 bg-[#8B5CF6] hover:bg-[#7C3AED] rounded-xl transition font-medium">Join Room</button>
            </div>
        </div>
        
        <div class="text-center text-xs text-gray-500 mt-6">
            🔒 End-to-end encrypted · No servers except Firebase
        </div>
    </div>
</div>

<div id="chatPanel" style="display: none; height: 100%; flex-direction: column;">
    <div class="chat-header">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#14B8A6] to-[#0D9488] flex items-center justify-center font-bold text-lg">F</div>
                <div>
                    <div class="font-semibold">Friend</div>
                    <div class="flex items-center gap-1">
                        <span id="statusDot" class="w-2 h-2 rounded-full status-online"></span>
                        <span id="statusText" class="text-xs text-gray-400">Online</span>
                    </div>
                </div>
            </div>
            <button id="leaveRoomBtn" class="text-gray-400 hover:text-red-400 transition px-2">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    
    <div id="messagesContainer" class="messages-area custom-scroll space-y-2"></div>
    
    <div class="input-area">
        <div class="flex items-center gap-2">
            <button id="emojiBtn" class="text-2xl text-gray-400 hover:text-white transition px-2">😊</button>
            <button id="imageBtn" class="text-xl text-gray-400 hover:text-white transition px-2"><i class="fas fa-image"></i></button>
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-[#1E293B] border border-[#334155] rounded-full px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-[#14B8A6] text-white">
            <button id="sendBtn" class="bg-gradient-to-r from-[#14B8A6] to-[#0D9488] w-10 h-10 rounded-full flex items-center justify-center transition active:scale-95">
                <i class="fas fa-paper-plane text-white text-sm"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCCz8lhH2fpNsmiByD7p8CKavsoO89zfQk",
        authDomain: "synq-2f6e7.firebaseapp.com",
        projectId: "synq-2f6e7",
        storageBucket: "synq-2f6e7.firebasestorage.app",
        messagingSenderId: "117419374371",
        appId: "1:117419374371:web:159eaf7981c5565b6abe96"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentRoom = null;
    let myId = Math.random().toString(36).substring(2, 8);
    let messages = [];
    let messageListener = null;
    let checkInterval = null;
    let typingTimeout = null;
    let isTyping = false;
    
    const setupPanel = document.getElementById('setupPanel');
    const chatPanel = document.getElementById('chatPanel');
    const messagesContainer = document.getElementById('messagesContainer');
    
    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function scrollToBottom() {
        if (messagesContainer) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function getStatusIcon(status) {
        if (status === 'sent') return '<i class="fas fa-check status-icons status-sent"></i>';
        if (status === 'delivered') return '<i class="fas fa-check-double status-icons status-delivered"></i>';
        if (status === 'read') return '<i class="fas fa-check-double status-icons status-read"></i>';
        return '';
    }
    
    function showImageModal(imageSrc) {
        const modal = document.createElement('div');
        modal.className = 'image-modal';
        modal.onclick = function() { modal.remove(); };
        const img = document.createElement('img');
        img.src = imageSrc;
        modal.appendChild(img);
        document.body.appendChild(modal);
    }
    
    function renderMessages() {
        if (!messagesContainer) return;
        
        if (messages.length === 0) {
            messagesContainer.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-500 text-center"><i class="fas fa-comment-dots text-3xl mb-2 opacity-30"></i><p>No messages yet.<br>Say hello to your friend!</p></div>';
            return;
        }
        
        let html = '';
        for (let i = 0; i < messages.length; i++) {
            const msg = messages[i];
            const isDeleted = msg.deleted === true;
            const displayText = isDeleted ? '(message deleted)' : (msg.edited ? msg.text + '<span class="edited-badge">edited</span>' : msg.text);
            
            if (msg.sent) {
                html += '<div class="flex justify-end mb-2 message-wrapper" data-message-id="' + msg.id + '">';
                html += '<div class="max-w-[75%] sent-bubble px-4 py-2 relative">';
                
                if (!isDeleted && !msg.isImage) {
                    html += '<div class="message-actions">';
                    html += '<button class="edit-msg" data-id="' + msg.id + '"><i class="fas fa-edit"></i> Edit</button>';
                    html += '<button class="delete-msg" data-id="' + msg.id + '"><i class="fas fa-trash-alt"></i> Delete</button>';
                    html += '</div>';
                }
                
                if (msg.isImage && msg.imageData) {
                    html += '<img src="' + msg.imageData + '" class="chat-image" onclick="showImageModal(\'' + msg.imageData + '\')">';
                } else {
                    html += '<p class="text-white break-words">' + escapeHtml(displayText) + '</p>';
                }
                
                html += '<div class="text-right text-[10px] text-white/60 mt-1 flex items-center justify-end">';
                html += escapeHtml(msg.time);
                html += getStatusIcon(msg.status);
                html += '</div></div></div>';
            } else {
                html += '<div class="flex justify-start mb-2">';
                html += '<div class="max-w-[75%] received-bubble px-4 py-2">';
                
                if (msg.isImage && msg.imageData) {
                    html += '<img src="' + msg.imageData + '" class="chat-image" onclick="showImageModal(\'' + msg.imageData + '\')">';
                } else {
                    html += '<p class="text-gray-100 break-words">' + escapeHtml(displayText) + '</p>';
                }
                
                html += '<div class="text-left text-[10px] text-gray-400 mt-1">' + escapeHtml(msg.time) + '</div>';
                html += '</div></div>';
                
                // Mark as read (only for text messages)
                if (msg.status !== 'read' && !isDeleted && !msg.isImage && msg.sent === false) {
                    setTimeout(function(id) {
                        db.ref('rooms/' + currentRoom + '/messages/' + id).update({ status: 'read' });
                    }, 500, msg.id);
                }
            }
        }
        messagesContainer.innerHTML = html;
        scrollToBottom();
        
        // Attach edit/delete event listeners
        document.querySelectorAll('.edit-msg').forEach(btn => {
            btn.onclick = function(e) {
                e.stopPropagation();
                editMessage(this.getAttribute('data-id'));
            };
        });
        document.querySelectorAll('.delete-msg').forEach(btn => {
            btn.onclick = function(e) {
                e.stopPropagation();
                deleteMessage(this.getAttribute('data-id'));
            };
        });
    }
    
    function editMessage(messageId) {
        const msg = messages.find(m => m.id == messageId);
        if (!msg || !msg.sent || msg.isImage) {
            showToast("Cannot edit this message");
            return;
        }
        
        const newText = prompt('Edit your message:', msg.text);
        if (newText && newText.trim() && newText.trim() !== msg.text) {
            msg.text = newText.trim();
            msg.edited = true;
            db.ref('rooms/' + currentRoom + '/messages/' + messageId).update({
                text: msg.text,
                edited: true
            });
            renderMessages();
            showToast('Message edited');
        }
    }
    
    function deleteMessage(messageId) {
        if (confirm('Delete this message?')) {
            const msg = messages.find(m => m.id == messageId);
            if (msg) {
                msg.deleted = true;
                msg.text = '';
                db.ref('rooms/' + currentRoom + '/messages/' + messageId).update({
                    deleted: true,
                    text: ''
                });
                renderMessages();
                showToast('Message deleted');
            }
        }
    }
    
    function addMessageToUI(text, isSent, isImage, imageData, status, messageId, edited, deleted) {
        const msg = {
            id: messageId || (Date.now() + Math.random()),
            text: text || (isImage ? "📷 Image" : ""),
            sent: isSent,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            isImage: isImage || false,
            imageData: imageData || null,
            status: status || (isSent ? 'sent' : 'delivered'),
            edited: edited || false,
            deleted: deleted || false
        };
        messages.push(msg);
        renderMessages();
        
        if (currentRoom && isSent && !messageId) {
            const newRef = db.ref('rooms/' + currentRoom + '/messages').push();
            msg.id = newRef.key;
            newRef.set({
                id: msg.id,
                text: msg.text,
                sentBy: myId,
                isImage: msg.isImage,
                imageData: msg.imageData,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                status: 'sent',
                edited: false,
                deleted: false
            });
        }
    }
    
    function sendMessage(text, isImage, imageData) {
        if (!currentRoom) {
            showToast("Not connected");
            return;
        }
        addMessageToUI(text, true, isImage, imageData, 'sent', null, false, false);
        
        // Update status to delivered after short delay (simulates friend receiving)
        setTimeout(() => {
            const lastMsg = messages[messages.length - 1];
            if (lastMsg && lastMsg.sent && lastMsg.status === 'sent') {
                lastMsg.status = 'delivered';
                if (currentRoom && lastMsg.id) {
                    db.ref('rooms/' + currentRoom + '/messages/' + lastMsg.id).update({ status: 'delivered' });
                }
                renderMessages();
            }
        }, 1000);
    }
    
    function sendTyping(isCurrentlyTyping) {
        if (currentRoom && isTyping !== isCurrentlyTyping) {
            isTyping = isCurrentlyTyping;
            db.ref('rooms/' + currentRoom + '/typing/' + myId).set(isTyping ? true : null);
        }
    }
    
    function enterChat(roomId) {
        if (currentRoom === roomId) return;
        currentRoom = roomId;
        
        setupPanel.style.display = 'none';
        chatPanel.style.display = 'flex';
        messages = [];
        
        // Load existing messages
        db.ref('rooms/' + roomId + '/messages').once('value', (snap) => {
            const msgs = snap.val();
            if (msgs) {
                for (let key in msgs) {
                    const msg = msgs[key];
                    messages.push({
                        id: msg.id || key,
                        text: msg.text || '',
                        sent: msg.sentBy === myId,
                        time: new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        isImage: msg.isImage || false,
                        imageData: msg.imageData,
                        status: msg.status || (msg.sentBy === myId ? 'sent' : 'delivered'),
                        edited: msg.edited || false,
                        deleted: msg.deleted || false
                    });
                }
                messages.sort((a, b) => (a.id || 0) - (b.id || 0));
                renderMessages();
            }
        });
        
        // Listen for new messages
        if (messageListener) messageListener.off();
        messageListener = db.ref('rooms/' + roomId + '/messages').limitToLast(50);
        messageListener.on('child_added', (snap) => {
            const msg = snap.val();
            if (msg.sentBy !== myId && !messages.find(m => m.id === msg.id)) {
                addMessageToUI(msg.text, false, msg.isImage || false, msg.imageData, 'delivered', msg.id, msg.edited || false, msg.deleted || false);
                
                // Mark as delivered to sender
                if (msg.sentBy !== myId) {
                    db.ref('rooms/' + roomId + '/messages/' + msg.id).update({ status: 'delivered' });
                }
            }
        });
        
        // Listen for message updates (status, edit, delete)
        db.ref('rooms/' + roomId + '/messages').on('child_changed', (snap) => {
            const updated = snap.val();
            const existingMsg = messages.find(m => m.id === updated.id);
            if (existingMsg) {
                existingMsg.status = updated.status || existingMsg.status;
                existingMsg.text = updated.text || existingMsg.text;
                existingMsg.edited = updated.edited || false;
                existingMsg.deleted = updated.deleted || false;
                renderMessages();
            }
        });
        
        // Listen for typing indicators
        db.ref('rooms/' + roomId + '/typing').on('value', (snap) => {
            const typing = snap.val();
            let someoneTyping = false;
            if (typing) {
                for (let id in typing) {
                    if (id !== myId && typing[id] === true) {
                        someoneTyping = true;
                        break;
                    }
                }
            }
            const typingEl = document.getElementById('typingIndicator');
            if (typingEl) {
                if (someoneTyping) {
                    if (!document.getElementById('typingIndicator')) {
                        const div = document.createElement('div');
                        div.id = 'typingIndicator';
                        div.className = 'px-4 py-1 text-xs text-gray-400 italic';
                        div.innerHTML = 'Friend is typing<span class="typing-dot ml-0.5">.</span><span class="typing-dot">.</span><span class="typing-dot">.</span>';
                        messagesContainer.parentNode.insertBefore(div, messagesContainer.nextSibling);
                    }
                } else {
                    const el = document.getElementById('typingIndicator');
                    if (el) el.remove();
                }
            }
        });
        
        scrollToBottom();
        setTimeout(() => document.getElementById('messageInput')?.focus(), 200);
    }
    
    function generateRoomCode() {
        return Math.random().toString(36).substring(2, 10).toUpperCase();
    }
    
    // ========== CREATE ROOM WITH POLLING ==========
    document.getElementById('createRoomBtn').onclick = function() {
        const roomCode = generateRoomCode();
        document.getElementById('roomCodeDisplay').innerText = roomCode;
        document.getElementById('createArea').classList.remove('hidden');
        document.getElementById('joinArea').classList.add('hidden');
        document.getElementById('waitingMessage').innerHTML = '⏳ Waiting for friend to join...';
        
        db.ref('rooms/' + roomCode).set({
            created: firebase.database.ServerValue.TIMESTAMP,
            creator: myId
        }).then(() => {
            showToast("Room created! Share the code with your friend");
            
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                db.ref('rooms/' + roomCode + '/joiner').once('value').then((snap) => {
                    const joinerId = snap.val();
                    if (joinerId && joinerId !== myId) {
                        clearInterval(checkInterval);
                        document.getElementById('waitingMessage').innerHTML = '✅ Friend joined! Entering chat...';
                        showToast("Friend joined! Entering chat...");
                        enterChat(roomCode);
                    }
                });
            }, 1000);
            
            setTimeout(() => {
                if (checkInterval) {
                    clearInterval(checkInterval);
                    if (!currentRoom) {
                        document.getElementById('waitingMessage').innerHTML = '⏰ No one joined. Refresh to try again.';
                    }
                }
            }, 300000);
        }).catch(err => showToast("Error: " + err.message));
    };
    
    document.getElementById('copyRoomCodeBtn').onclick = function() {
        const code = document.getElementById('roomCodeDisplay').innerText;
        if (code) {
            navigator.clipboard.writeText(code);
            showToast("Code copied!");
        }
    };
    
    // ========== JOIN ROOM ==========
    document.getElementById('joinRoomBtn').onclick = function() {
        document.getElementById('joinArea').classList.remove('hidden');
        document.getElementById('createArea').classList.add('hidden');
    };
    
    document.getElementById('doJoinBtn').onclick = function() {
        const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
        if (!code) {
            showToast("Enter a room code");
            return;
        }
        
        db.ref('rooms/' + code).once('value').then((snap) => {
            if (!snap.exists()) {
                showToast("Room not found. Check the code.");
                return;
            }
            db.ref('rooms/' + code + '/joiner').set(myId).then(() => {
                showToast("Joined room!");
                enterChat(code);
            });
        }).catch(() => showToast("Error connecting"));
    };
    
    document.getElementById('leaveRoomBtn').onclick = function() {
        if (confirm("Leave the room?")) {
            if (messageListener) messageListener.off();
            if (checkInterval) clearInterval(checkInterval);
            location.reload();
        }
    };
    
    document.getElementById('sendBtn').onclick = function() {
        const input = document.getElementById('messageInput');
        if (input.value.trim()) {
            sendMessage(input.value.trim(), false, null);
            input.value = '';
            sendTyping(false);
        }
    };
    
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('sendBtn').click();
        }
    });
    
    document.getElementById('messageInput').addEventListener('input', function() {
        sendTyping(true);
        if (typingTimeout) clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => sendTyping(false), 1500);
    });
    
    // Emoji picker
    let emojiDiv = null;
    document.getElementById('emojiBtn').onclick = function(e) {
        e.stopPropagation();
        if (emojiDiv) { emojiDiv.remove(); emojiDiv = null; return; }
        emojiDiv = document.createElement('div');
        emojiDiv.className = 'fixed bottom-20 left-4 bg-[#1E293B] border border-[#334155] rounded-xl p-2 grid grid-cols-7 gap-1 z-50';
        const emojis = ['😊','😂','❤️','🔥','👍','🎉','😢','😎','🤔','👀','✅','💯','✨','🌟','🥳','😍','💪','👏','🚀','🎈'];
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.textContent = e;
            btn.className = 'p-2 hover:bg-[#334155] rounded-lg text-xl';
            btn.onclick = (e) => {
                e.stopPropagation();
                document.getElementById('messageInput').value += e.target.textContent;
                emojiDiv.remove();
                emojiDiv = null;
                document.getElementById('messageInput').focus();
            };
            emojiDiv.appendChild(btn);
        });
        document.body.appendChild(emojiDiv);
    };
    document.addEventListener('click', () => { if (emojiDiv) { emojiDiv.remove(); emojiDiv = null; } });
    
    // Image upload (5MB limit)
    document.getElementById('imageBtn').onclick = function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (file && file.size < 5 * 1024 * 1024) {
                showToast("Uploading image...");
                const reader = new FileReader();
                reader.onload = function(ev) {
                    sendMessage("", true, ev.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                showToast("Image too large (max 5MB)");
            }
        };
        input.click();
    };
</script>
</body>
</html>
