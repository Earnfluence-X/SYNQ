<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>SYNQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        body { 
            background: #0A0A0F;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(114, 9, 183, 0.15) 0%, rgba(0, 0, 0, 0.95) 100%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* geometric pattern overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(20, 162, 157, 0.03) 0px, rgba(20, 162, 157, 0.03) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(135deg, rgba(114, 9, 183, 0.03) 0px, rgba(114, 9, 183, 0.03) 1px, transparent 1px, transparent 40px);
            pointer-events: none;
            z-index: 0;
        }
        
        .glow-purple {
            box-shadow: 0 0 20px rgba(114, 9, 183, 0.3);
        }
        
        .glow-teal {
            box-shadow: 0 0 20px rgba(20, 162, 157, 0.3);
        }
        
        #setupPanel {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }
        
        #chatPanel {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(2px);
        }
        
        .chat-header {
            flex-shrink: 0;
            background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(114, 9, 183, 0.4);
            padding: 12px 16px;
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
        }
        
        .input-area {
            flex-shrink: 0;
            background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(114, 9, 183, 0.4);
            padding: 12px 16px;
        }
        
        /* Sent messages - Purple to Teal gradient */
        .sent-bubble { 
            background: linear-gradient(135deg, #7209B7 0%, #14A29D 100%);
            border-radius: 20px 20px 4px 20px;
            position: relative;
        }
        
        /* Received messages */
        .received-bubble { 
            background: #1A1A2E;
            border-radius: 20px 20px 20px 4px;
            border: 1px solid rgba(20, 162, 157, 0.4);
        }
        
        .message-actions {
            position: absolute;
            top: -32px;
            right: 0;
            background: #1A1A2E;
            border-radius: 24px;
            padding: 6px 14px;
            gap: 16px;
            display: none;
            z-index: 10;
            border: 1px solid rgba(114, 9, 183, 0.5);
            backdrop-filter: blur(8px);
        }
        .message-wrapper:hover .message-actions {
            display: flex;
        }
        .message-actions button {
            background: none;
            border: none;
            color: #14A29D;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .message-actions button:hover {
            background: rgba(114, 9, 183, 0.3);
            color: #BD70FF;
        }
        
        .chat-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
            margin: 4px 0;
            object-fit: cover;
            border: 1px solid rgba(20, 162, 157, 0.4);
        }
        
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: 2px solid #7209B7;
            border-radius: 8px;
        }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1A1A2E; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #7209B7; border-radius: 4px; }
        
        .status-online { background-color: #14A29D; box-shadow: 0 0 8px rgba(20,162,157,0.5); }
        .status-offline { background-color: #4A4A5A; }
        
        .status-icons {
            font-size: 10px;
            margin-left: 8px;
        }
        .status-sent { color: #666; }
        .status-delivered { color: #14A29D; }
        .status-read { color: #BD70FF; text-shadow: 0 0 2px rgba(114,9,183,0.5); }
        
        .premium-btn {
            transition: all 0.2s ease;
            border: 1px solid rgba(114, 9, 183, 0.4);
            background: linear-gradient(135deg, #1A1A2E 0%, #0F0F1A 100%);
        }
        .premium-btn:hover {
            border-color: #14A29D;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(114, 9, 183, 0.2);
        }
        
        .premium-input {
            background: #1A1A2E;
            border: 1px solid rgba(114, 9, 183, 0.4);
            transition: all 0.2s;
        }
        .premium-input:focus {
            border-color: #14A29D;
            box-shadow: 0 0 12px rgba(20, 162, 157, 0.2);
        }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1A1A2E;
            border: 1px solid #7209B7;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 200;
            animation: fadeInOut 2s ease;
            white-space: nowrap;
            color: #14A29D;
            font-weight: 500;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        button { cursor: pointer; }
        input { outline: none; }
        
        .premium-card {
            background: rgba(18, 18, 30, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(114, 9, 183, 0.4);
            border-radius: 28px;
        }
        
        /* Animated gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #7209B7 0%, #14A29D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Pulse animation for status */
        @keyframes subtlePulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .typing-indicator {
            animation: subtlePulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>

<div id="setupPanel">
    <div class="max-w-md w-full premium-card p-6">
        <div class="text-center mb-8">
            <div class="text-5xl font-bold tracking-tight gradient-text">
                SYNQ
            </div>
            <p class="text-gray-400 text-sm mt-2 font-light">Amethyst & Teal · Encrypted</p>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button id="createRoomBtn" class="py-3 premium-btn rounded-xl transition font-medium text-white">Create Room</button>
            <button id="joinRoomBtn" class="py-3 premium-btn rounded-xl transition font-medium text-white">Join Room</button>
        </div>
        
        <div id="createArea" class="hidden">
            <div class="text-center">
                <div class="text-[#14A29D] mb-2 text-sm uppercase tracking-wider font-semibold">Your Room Code</div>
                <div class="bg-[#0A0A0F] p-4 rounded-xl mb-3 border border-[#7209B7]/30">
                    <span id="roomCodeDisplay" class="text-2xl font-mono tracking-wider font-bold text-[#14A29D]"></span>
                </div>
                <button id="copyRoomCodeBtn" class="w-full py-2 premium-btn rounded-lg transition text-sm text-white">Copy Code</button>
                <div class="text-xs text-gray-500 mt-3">Send this code to your friend</div>
                <div id="waitingMessage" class="mt-4 text-[#14A29D] text-sm">Waiting for peer...</div>
            </div>
        </div>
        
        <div id="joinArea" class="hidden">
            <input type="text" id="joinCodeInput" placeholder="Enter code" class="w-full premium-input rounded-xl p-3 text-center text-xl font-mono tracking-wider uppercase mb-3 text-white">
            <button id="doJoinBtn" class="w-full py-3 premium-btn rounded-xl transition font-medium text-white">Join Room</button>
        </div>
        
        <div class="text-center text-xs text-gray-500 mt-6">
            End-to-end encrypted
        </div>
    </div>
</div>

<div id="chatPanel" style="display: none; height: 100%; flex-direction: column;">
    <div class="chat-header">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#7209B7] to-[#14A29D] flex items-center justify-center font-bold text-lg text-white">S</div>
                <div>
                    <div class="font-semibold text-white">Friend</div>
                    <div class="flex items-center gap-1">
                        <span id="statusDot" class="w-2 h-2 rounded-full status-online"></span>
                        <span id="statusText" class="text-xs text-gray-400">Online</span>
                    </div>
                </div>
            </div>
            <button id="leaveRoomBtn" class="text-gray-400 hover:text-[#14A29D] transition px-2">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    
    <div id="messagesContainer" class="messages-area custom-scroll space-y-2"></div>
    
    <div class="input-area">
        <div class="flex items-center gap-2">
            <button id="emojiBtn" class="text-2xl text-gray-400 hover:text-[#14A29D] transition px-2">😊</button>
            <button id="imageBtn" class="text-xl text-gray-400 hover:text-[#14A29D] transition px-2"><i class="fas fa-image"></i></button>
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 premium-input rounded-full px-5 py-2.5 focus:outline-none text-white placeholder-gray-500">
            <button id="sendBtn" class="bg-gradient-to-r from-[#7209B7] to-[#14A29D] w-10 h-10 rounded-full flex items-center justify-center transition active:scale-95 shadow-lg" style="box-shadow: 0 0 12px rgba(114,9,183,0.3);">
                <i class="fas fa-paper-plane text-white text-sm"></i>
            </button>
        </div>
    </div>
</div>

<script>
    window.showImageModal = function(src) {
        const modal = document.createElement('div');
        modal.className = 'image-modal';
        modal.onclick = () => modal.remove();
        const img = document.createElement('img');
        img.src = src;
        modal.appendChild(img);
        document.body.appendChild(modal);
    };
    
    const firebaseConfig = {
        apiKey: "AIzaSyCCz8lhH2fpNsmiByD7p8CKavsoO89zfQk",
        authDomain: "synq-2f6e7.firebaseapp.com",
        projectId: "synq-2f6e7",
        storageBucket: "synq-2f6e7.firebasestorage.app",
        messagingSenderId: "117419374371",
        appId: "1:117419374371:web:159eaf7981c5565b6abe96"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentRoom = null;
    let myId = Math.random().toString(36).substring(2, 8);
    let messages = [];
    let messageListener = null;
    let checkInterval = null;
    let typingTimeout = null;
    let isTyping = false;
    
    const setupPanel = document.getElementById('setupPanel');
    const chatPanel = document.getElementById('chatPanel');
    const messagesContainer = document.getElementById('messagesContainer');
    
    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function scrollToBottom() {
        if (messagesContainer) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function getStatusIcon(status) {
        if (status === 'sent') return '<i class="fas fa-check status-icons status-sent"></i>';
        if (status === 'delivered') return '<i class="fas fa-check-double status-icons status-delivered"></i>';
        if (status === 'read') return '<i class="fas fa-check-double status-icons status-read"></i>';
        return '';
    }
    
    function renderMessages() {
        if (!messagesContainer) return;
        
        if (messages.length === 0) {
            messagesContainer.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-500 text-center"><i class="fas fa-lock text-3xl mb-3 opacity-30"></i><p class="text-sm font-light">No messages yet.<br>Begin your secure conversation.</p></div>';
            return;
        }
        
        let html = '';
        for (let i = 0; i < messages.length; i++) {
            const msg = messages[i];
            const isDeleted = msg.deleted === true;
            const displayText = isDeleted ? '(message deleted)' : msg.text;
            
            if (msg.sent) {
                html += '<div class="flex justify-end mb-3 message-wrapper" data-message-id="' + msg.id + '">';
                html += '<div class="max-w-[75%] sent-bubble px-4 py-2 relative">';
                
                if (!isDeleted && !msg.isImage && !msg.deleted) {
                    html += '<div class="message-actions">';
                    html += '<button class="edit-msg" data-id="' + msg.id + '"><i class="fas fa-edit mr-1"></i>Edit</button>';
                    html += '<button class="delete-msg" data-id="' + msg.id + '"><i class="fas fa-trash-alt mr-1"></i>Delete</button>';
                    html += '</div>';
                }
                
                if (msg.isImage && msg.imageData) {
                    html += '<img src="' + msg.imageData + '" class="chat-image cursor-pointer" onclick="showImageModal(\'' + msg.imageData + '\')">';
                } else {
                    html += '<p class="text-white break-words text-sm font-light leading-relaxed">' + escapeHtml(displayText) + '</p>';
                }
                
                html += '<div class="text-right text-[10px] text-gray-400 mt-1 flex items-center justify-end">';
                html += escapeHtml(msg.time);
                html += getStatusIcon(msg.status);
                html += '</div></div></div>';
            } else {
                html += '<div class="flex justify-start mb-3">';
                html += '<div class="max-w-[75%] received-bubble px-4 py-2">';
                
                if (msg.isImage && msg.imageData) {
                    html += '<img src="' + msg.imageData + '" class="chat-image cursor-pointer" onclick="showImageModal(\'' + msg.imageData + '\')">';
                } else {
                    html += '<p class="text-gray-200 break-words text-sm font-light leading-relaxed">' + escapeHtml(displayText) + '</p>';
                }
                
                html += '<div class="text-left text-[10px] text-gray-500 mt-1">' + escapeHtml(msg.time) + '</div>';
                html += '</div></div>';
                
                if (msg.status !== 'read' && !isDeleted && !msg.isImage && msg.sent === false) {
                    setTimeout(function(id) {
                        db.ref('rooms/' + currentRoom + '/messages/' + id).update({ status: 'read' });
                    }, 500, msg.id);
                }
            }
        }
        messagesContainer.innerHTML = html;
        scrollToBottom();
        
        document.querySelectorAll('.edit-msg').forEach(btn => {
            btn.onclick = (e) => { e.stopPropagation(); editMessage(btn.getAttribute('data-id')); };
        });
        document.querySelectorAll('.delete-msg').forEach(btn => {
            btn.onclick = (e) => { e.stopPropagation(); deleteMessage(btn.getAttribute('data-id')); };
        });
    }
    
    function editMessage(messageId) {
        const msg = messages.find(m => m.id == messageId);
        if (!msg || !msg.sent || msg.isImage) {
            showToast("Cannot edit this message");
            return;
        }
        const newText = prompt('Edit message:', msg.text);
        if (newText && newText.trim() && newText.trim() !== msg.text) {
            msg.text = newText.trim();
            db.ref('rooms/' + currentRoom + '/messages/' + messageId).update({ text: msg.text });
            renderMessages();
            showToast('Message updated');
        }
    }
    
    function deleteMessage(messageId) {
        if (confirm('Delete this message?')) {
            const msg = messages.find(m => m.id == messageId);
            if (msg) {
                msg.deleted = true;
                msg.text = '';
                db.ref('rooms/' + currentRoom + '/messages/' + messageId).update({ deleted: true, text: '' });
                renderMessages();
                showToast('Message deleted');
            }
        }
    }
    
    function addMessageToUI(text, isSent, isImage, imageData, status, messageId, deleted) {
        const msg = {
            id: messageId || (Date.now() + Math.random()),
            text: text || (isImage ? "📷 Image" : ""),
            sent: isSent,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            isImage: isImage || false,
            imageData: imageData || null,
            status: status || (isSent ? 'sent' : 'delivered'),
            deleted: deleted || false
        };
        messages.push(msg);
        renderMessages();
        
        if (currentRoom && isSent && !messageId) {
            const newRef = db.ref('rooms/' + currentRoom + '/messages').push();
            msg.id = newRef.key;
            newRef.set({
                id: msg.id,
                text: msg.text,
                sentBy: myId,
                isImage: msg.isImage,
                imageData: msg.imageData,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                status: 'sent',
                deleted: false
            });
        }
    }
    
    function sendMessage(text, isImage, imageData) {
        if (!currentRoom) { showToast("Not connected"); return; }
        addMessageToUI(text, true, isImage, imageData, 'sent', null, false);
        setTimeout(() => {
            const lastMsg = messages[messages.length - 1];
            if (lastMsg && lastMsg.sent && lastMsg.status === 'sent') {
                lastMsg.status = 'delivered';
                if (currentRoom && lastMsg.id) {
                    db.ref('rooms/' + currentRoom + '/messages/' + lastMsg.id).update({ status: 'delivered' });
                }
                renderMessages();
            }
        }, 1000);
    }
    
    function sendTyping(isCurrentlyTyping) {
        if (currentRoom && isTyping !== isCurrentlyTyping) {
            isTyping = isCurrentlyTyping;
            db.ref('rooms/' + currentRoom + '/typing/' + myId).set(isTyping ? true : null);
        }
    }
    
    function enterChat(roomId) {
        if (currentRoom === roomId) return;
        currentRoom = roomId;
        setupPanel.style.display = 'none';
        chatPanel.style.display = 'flex';
        messages = [];
        
        db.ref('rooms/' + roomId + '/messages').once('value', (snap) => {
            const msgs = snap.val();
            if (msgs) {
                for (let key in msgs) {
                    const msg = msgs[key];
                    messages.push({
                        id: msg.id || key,
                        text: msg.text || '',
                        sent: msg.sentBy === myId,
                        time: new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        isImage: msg.isImage || false,
                        imageData: msg.imageData,
                        status: msg.status || (msg.sentBy === myId ? 'sent' : 'delivered'),
                        deleted: msg.deleted || false
                    });
                }
                messages.sort((a, b) => (a.id || 0) - (b.id || 0));
                renderMessages();
            }
        });
        
        if (messageListener) messageListener.off();
        messageListener = db.ref('rooms/' + roomId + '/messages').limitToLast(50);
        messageListener.on('child_added', (snap) => {
            const msg = snap.val();
            if (msg.sentBy !== myId && !messages.find(m => m.id === msg.id)) {
                addMessageToUI(msg.text, false, msg.isImage || false, msg.imageData, 'delivered', msg.id, msg.deleted || false);
                if (msg.sentBy !== myId) {
                    db.ref('rooms/' + roomId + '/messages/' + msg.id).update({ status: 'delivered' });
                }
            }
        });
        
        db.ref('rooms/' + roomId + '/messages').on('child_changed', (snap) => {
            const updated = snap.val();
            const existingMsg = messages.find(m => m.id === updated.id);
            if (existingMsg) {
                existingMsg.status = updated.status || existingMsg.status;
                existingMsg.text = updated.text || existingMsg.text;
                existingMsg.deleted = updated.deleted || false;
                renderMessages();
            }
        });
        
        db.ref('rooms/' + roomId + '/typing').on('value', (snap) => {
            const typing = snap.val();
            let someoneTyping = false;
            if (typing) {
                for (let id in typing) {
                    if (id !== myId && typing[id] === true) {
                        someoneTyping = true;
                        break;
                    }
                }
            }
            const indicator = document.getElementById('typingIndicator');
            if (someoneTyping) {
                if (!indicator) {
                    const div = document.createElement('div');
                    div.id = 'typingIndicator';
                    div.className = 'px-4 py-2 text-xs text-[#14A29D] italic typing-indicator';
                    div.innerHTML = 'Friend is typing <i class="fas fa-ellipsis-h"></i>';
                    messagesContainer.parentNode.insertBefore(div, messagesContainer.nextSibling);
                    scrollToBottom();
                }
            } else {
                if (indicator) indicator.remove();
            }
        });
        
        scrollToBottom();
        setTimeout(() => document.getElementById('messageInput')?.focus(), 200);
    }
    
    function generateRoomCode() {
        return Math.random().toString(36).substring(2, 10).toUpperCase();
    }
    
    document.getElementById('createRoomBtn').onclick = function() {
        const roomCode = generateRoomCode();
        document.getElementById('roomCodeDisplay').innerText = roomCode;
        document.getElementById('createArea').classList.remove('hidden');
        document.getElementById('joinArea').classList.add('hidden');
        document.getElementById('waitingMessage').innerHTML = '⏳ Waiting for peer...';
        
        db.ref('rooms/' + roomCode).set({ created: firebase.database.ServerValue.TIMESTAMP, creator: myId })
            .then(() => {
                showToast("Room created. Share invitation code.");
                if (checkInterval) clearInterval(checkInterval);
                checkInterval = setInterval(() => {
                    db.ref('rooms/' + roomCode + '/joiner').once('value').then((snap) => {
                        if (snap.val() && snap.val() !== myId) {
                            clearInterval(checkInterval);
                            document.getElementById('waitingMessage').innerHTML = '✅ Peer connected!';
                            showToast("Peer joined. Entering secure channel.");
                            enterChat(roomCode);
                        }
                    });
                }, 1000);
                setTimeout(() => {
                    if (checkInterval) { clearInterval(checkInterval); if (!currentRoom) document.getElementById('waitingMessage').innerHTML = '⏰ Timeout. Refresh to retry.'; }
                }, 300000);
            }).catch(err => showToast("Error: " + err.message));
    };
    
    document.getElementById('copyRoomCodeBtn').onclick = function() {
        const code = document.getElementById('roomCodeDisplay').innerText;
        if (code) { navigator.clipboard.writeText(code); showToast("Code copied."); }
    };
    
    document.getElementById('joinRoomBtn').onclick = function() {
        document.getElementById('joinArea').classList.remove('hidden');
        document.getElementById('createArea').classList.add('hidden');
    };
    
    document.getElementById('doJoinBtn').onclick = function() {
        const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
        if (!code) { showToast("Enter room code"); return; }
        db.ref('rooms/' + code).once('value').then((snap) => {
            if (!snap.exists()) { showToast("Room not found."); return; }
            db.ref('rooms/' + code + '/joiner').set(myId).then(() => { showToast("Connected."); enterChat(code); });
        }).catch(() => showToast("Connection error"));
    };
    
    document.getElementById('leaveRoomBtn').onclick = function() {
        if (confirm("Disconnect?")) {
            if (messageListener) messageListener.off();
            if (checkInterval) clearInterval(checkInterval);
            location.reload();
        }
    };
    
    document.getElementById('sendBtn').onclick = function() {
        const input = document.getElementById('messageInput');
        if (input.value.trim()) { sendMessage(input.value.trim(), false, null); input.value = ''; sendTyping(false); }
    };
    
    document.getElementById('messageInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });
    document.getElementById('messageInput').addEventListener('input', function() { sendTyping(true); if (typingTimeout) clearTimeout(typingTimeout); typingTimeout = setTimeout(() => sendTyping(false), 1500); });
    
    let emojiDiv = null;
    document.getElementById('emojiBtn').onclick = function(e) {
        e.stopPropagation();
        if (emojiDiv) { emojiDiv.remove(); emojiDiv = null; return; }
        emojiDiv = document.createElement('div');
        emojiDiv.className = 'fixed bottom-20 left-4 bg-[#1A1A2E] border border-[#7209B7]/40 rounded-xl p-2 grid grid-cols-7 gap-1 z-50';
        const emojis = ['😊','😂','❤️','🔥','👍','🎉','😢','😎','🤔','👀','✅','💯','✨','🌟','🥳','😍','💪','👏','🚀','🎈'];
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.textContent = e;
            btn.className = 'p-2 hover:bg-[#7209B7]/20 rounded-lg text-xl transition';
            btn.onclick = (e) => { e.stopPropagation(); document.getElementById('messageInput').value += e.target.textContent; emojiDiv.remove(); emojiDiv = null; document.getElementById('messageInput').focus(); };
            emojiDiv.appendChild(btn);
        });
        document.body.appendChild(emojiDiv);
    };
    document.addEventListener('click', () => { if (emojiDiv) { emojiDiv.remove(); emojiDiv = null; } });
    
    document.getElementById('imageBtn').onclick = function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (file && file.size < 5 * 1024 * 1024) {
                showToast("Uploading image...");
                const reader = new FileReader();
                reader.onload = function(ev) { sendMessage("", true, ev.target.result); };
                reader.readAsDataURL(file);
            } else { showToast("Image too large (max 5MB)"); }
        };
        input.click();
    };
</script>
</body>
</html>
