<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>SYNQ · Private Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0F172A; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        
        #setupPanel {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
        }
        
        #chatPanel {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            flex-shrink: 0;
            background: #1E293B;
            border-bottom: 1px solid #334155;
            padding: 12px 16px;
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .input-area {
            flex-shrink: 0;
            background: #0F172A;
            border-top: 1px solid #334155;
            padding: 12px 16px;
        }
        
        .sent-bubble { background: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%); border-radius: 18px 18px 0 18px; }
        .received-bubble { background: #334155; border-radius: 18px 18px 18px 0; }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1E293B; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .status-online { background-color: #22C55E; }
        .status-offline { background-color: #64748B; }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 200;
            animation: fadeInOut 2s ease;
            white-space: nowrap;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        button { cursor: pointer; }
        input { outline: none; }
    </style>
</head>
<body>

<div id="setupPanel">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="text-4xl font-bold bg-gradient-to-r from-[#14B8A6] to-[#8B5CF6] bg-clip-text text-transparent">SYNQ</div>
            <p class="text-gray-400 text-sm mt-1">Private · Encrypted · No login</p>
        </div>
        
        <div class="bg-[#1E293B] rounded-2xl border border-[#334155] p-6">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button id="createRoomBtn" class="py-3 bg-[#14B8A6] hover:bg-[#0D9488] rounded-xl transition font-medium">Create Room</button>
                <button id="joinRoomBtn" class="py-3 bg-[#8B5CF6] hover:bg-[#7C3AED] rounded-xl transition font-medium">Join Room</button>
            </div>
            
            <div id="createArea" class="hidden">
                <div class="text-center">
                    <div class="text-emerald-400 mb-2">✨ Your Room Code</div>
                    <div class="bg-[#0F172A] p-4 rounded-xl mb-3">
                        <span id="roomCodeDisplay" class="text-2xl font-mono tracking-wider font-bold"></span>
                    </div>
                    <button id="copyRoomCodeBtn" class="w-full py-2 bg-[#334155] hover:bg-[#475569] rounded-lg transition">Copy Code</button>
                    <div class="text-xs text-gray-500 mt-3">Send this code to your friend</div>
                    <div id="waitingMessage" class="mt-4 text-yellow-400 text-sm">⏳ Waiting for friend to join...</div>
                </div>
            </div>
            
            <div id="joinArea" class="hidden">
                <input type="text" id="joinCodeInput" placeholder="Enter code" class="w-full bg-[#0F172A] border border-[#334155] rounded-xl p-3 text-center text-xl font-mono tracking-wider uppercase mb-3">
                <button id="doJoinBtn" class="w-full py-3 bg-[#8B5CF6] hover:bg-[#7C3AED] rounded-xl transition font-medium">Join Room</button>
            </div>
        </div>
        
        <div class="text-center text-xs text-gray-500 mt-6">
            🔒 End-to-end encrypted · No servers except Firebase
        </div>
    </div>
</div>

<div id="chatPanel" style="display: none; height: 100%; flex-direction: column;">
    <div class="chat-header">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#14B8A6] to-[#0D9488] flex items-center justify-center font-bold text-lg">F</div>
                <div>
                    <div class="font-semibold">Friend</div>
                    <div class="flex items-center gap-1">
                        <span id="statusDot" class="w-2 h-2 rounded-full status-offline"></span>
                        <span id="statusText" class="text-xs text-gray-400">Connected</span>
                    </div>
                </div>
            </div>
            <button id="leaveRoomBtn" class="text-gray-400 hover:text-red-400 transition px-2">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    
    <div id="messagesContainer" class="messages-area custom-scroll space-y-2"></div>
    
    <div class="input-area">
        <div class="flex items-center gap-2">
            <button id="emojiBtn" class="text-2xl text-gray-400 hover:text-white transition px-2">😊</button>
            <button id="imageBtn" class="text-xl text-gray-400 hover:text-white transition px-2"><i class="fas fa-image"></i></button>
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-[#1E293B] border border-[#334155] rounded-full px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-[#14B8A6] text-white">
            <button id="sendBtn" class="bg-gradient-to-r from-[#14B8A6] to-[#0D9488] w-10 h-10 rounded-full flex items-center justify-center transition active:scale-95">
                <i class="fas fa-paper-plane text-white text-sm"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCCz8lhH2fpNsmiByD7p8CKavsoO89zfQk",
        authDomain: "synq-2f6e7.firebaseapp.com",
        projectId: "synq-2f6e7",
        storageBucket: "synq-2f6e7.firebasestorage.app",
        messagingSenderId: "117419374371",
        appId: "1:117419374371:web:159eaf7981c5565b6abe96"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentRoom = null;
    let myId = Math.random().toString(36).substring(2, 8);
    let messages = [];
    let messageListener = null;
    let checkInterval = null;
    let typingTimeout = null;
    
    const setupPanel = document.getElementById('setupPanel');
    const chatPanel = document.getElementById('chatPanel');
    const messagesContainer = document.getElementById('messagesContainer');
    
    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function scrollToBottom() {
        if (messagesContainer) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function renderMessages() {
        if (!messagesContainer) return;
        
        if (messages.length === 0) {
            messagesContainer.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-500 text-center"><i class="fas fa-comment-dots text-3xl mb-2 opacity-30"></i><p>No messages yet.<br>Say hello to your friend!</p></div>';
            return;
        }
        
        let html = '';
        for (let i = 0; i < messages.length; i++) {
            const msg = messages[i];
            if (msg.sent) {
                html += '<div class="flex justify-end mb-2"><div class="max-w-[75%] sent-bubble px-4 py-2"><p class="text-white break-words">' + escapeHtml(msg.text) + '</p><div class="text-right text-[10px] text-white/60 mt-1">' + escapeHtml(msg.time) + '</div></div></div>';
            } else {
                html += '<div class="flex justify-start mb-2"><div class="max-w-[75%] received-bubble px-4 py-2"><p class="text-gray-100 break-words">' + escapeHtml(msg.text) + '</p><div class="text-left text-[10px] text-gray-400 mt-1">' + escapeHtml(msg.time) + '</div></div></div>';
            }
        }
        messagesContainer.innerHTML = html;
        scrollToBottom();
    }
    
    function addMessage(text, isSent) {
        const msg = {
            id: Date.now(),
            text: text,
            sent: isSent,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        messages.push(msg);
        renderMessages();
        
        if (currentRoom && isSent) {
            db.ref('rooms/' + currentRoom + '/messages').push({
                text: text,
                sentBy: myId,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }
    }
    
    function sendMessage(text) {
        if (!currentRoom) {
            showToast("Not connected");
            return;
        }
        addMessage(text, true);
    }
    
    function enterChat(roomId) {
        if (currentRoom === roomId) return;
        currentRoom = roomId;
        
        setupPanel.style.display = 'none';
        chatPanel.style.display = 'flex';
        messages = [];
        
        // Load existing messages
        db.ref('rooms/' + roomId + '/messages').once('value', (snap) => {
            const msgs = snap.val();
            if (msgs) {
                for (let key in msgs) {
                    const msg = msgs[key];
                    messages.push({
                        id: key,
                        text: msg.text,
                        sent: msg.sentBy === myId,
                        time: new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                }
                messages.sort((a, b) => a.id - b.id);
                renderMessages();
            }
        });
        
        // Listen for new messages
        if (messageListener) messageListener.off();
        messageListener = db.ref('rooms/' + roomId + '/messages').limitToLast(50);
        messageListener.on('child_added', (snap) => {
            const msg = snap.val();
            if (msg.sentBy !== myId) {
                addMessage(msg.text, false);
            }
        });
        
        scrollToBottom();
        setTimeout(() => document.getElementById('messageInput')?.focus(), 200);
    }
    
    function generateRoomCode() {
        return Math.random().toString(36).substring(2, 10).toUpperCase();
    }
    
    // ========== CREATE ROOM WITH POLLING (100% RELIABLE) ==========
    document.getElementById('createRoomBtn').onclick = function() {
        const roomCode = generateRoomCode();
        document.getElementById('roomCodeDisplay').innerText = roomCode;
        document.getElementById('createArea').classList.remove('hidden');
        document.getElementById('joinArea').classList.add('hidden');
        document.getElementById('waitingMessage').innerHTML = '⏳ Waiting for friend to join...';
        
        db.ref('rooms/' + roomCode).set({
            created: firebase.database.ServerValue.TIMESTAMP,
            creator: myId
        }).then(() => {
            showToast("Room created! Share the code with your friend");
            
            // POLLING: Check every second for joiner (100% reliable)
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                db.ref('rooms/' + roomCode + '/joiner').once('value').then((snap) => {
                    const joinerId = snap.val();
                    if (joinerId && joinerId !== myId) {
                        clearInterval(checkInterval);
                        document.getElementById('waitingMessage').innerHTML = '✅ Friend joined! Entering chat...';
                        showToast("Friend joined! Entering chat...");
                        enterChat(roomCode);
                    }
                });
            }, 1000);
            
            // Stop polling after 5 minutes
            setTimeout(() => {
                if (checkInterval) {
                    clearInterval(checkInterval);
                    if (!currentRoom) {
                        document.getElementById('waitingMessage').innerHTML = '⏰ No one joined. Refresh to try again.';
                    }
                }
            }, 300000);
        }).catch(err => showToast("Error: " + err.message));
    };
    
    document.getElementById('copyRoomCodeBtn').onclick = function() {
        const code = document.getElementById('roomCodeDisplay').innerText;
        if (code) {
            navigator.clipboard.writeText(code);
            showToast("Code copied!");
        }
    };
    
    // ========== JOIN ROOM ==========
    document.getElementById('joinRoomBtn').onclick = function() {
        document.getElementById('joinArea').classList.remove('hidden');
        document.getElementById('createArea').classList.add('hidden');
    };
    
    document.getElementById('doJoinBtn').onclick = function() {
        const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
        if (!code) {
            showToast("Enter a room code");
            return;
        }
        
        db.ref('rooms/' + code).once('value').then((snap) => {
            if (!snap.exists()) {
                showToast("Room not found. Check the code.");
                return;
            }
            db.ref('rooms/' + code + '/joiner').set(myId).then(() => {
                showToast("Joined room!");
                enterChat(code);
            });
        }).catch(() => showToast("Error connecting"));
    };
    
    document.getElementById('leaveRoomBtn').onclick = function() {
        if (confirm("Leave the room?")) {
            if (messageListener) messageListener.off();
            if (checkInterval) clearInterval(checkInterval);
            location.reload();
        }
    };
    
    document.getElementById('sendBtn').onclick = function() {
        const input = document.getElementById('messageInput');
        if (input.value.trim()) {
            sendMessage(input.value.trim());
            input.value = '';
        }
    };
    
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });
    
    // Simple emoji picker
    let emojiDiv = null;
    document.getElementById('emojiBtn').onclick = function(e) {
        e.stopPropagation();
        if (emojiDiv) { emojiDiv.remove(); emojiDiv = null; return; }
        emojiDiv = document.createElement('div');
        emojiDiv.className = 'fixed bottom-20 left-4 bg-[#1E293B] border border-[#334155] rounded-xl p-2 grid grid-cols-7 gap-1 z-50';
        const emojis = ['😊','😂','❤️','🔥','👍','🎉','😢','😎','🤔','👀','✅','💯','✨','🌟','🥳','😍','💪','👏','🚀','🎈'];
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.textContent = e;
            btn.className = 'p-2 hover:bg-[#334155] rounded-lg text-xl';
            btn.onclick = (e) => {
                e.stopPropagation();
                document.getElementById('messageInput').value += e.target.textContent;
                emojiDiv.remove();
                emojiDiv = null;
                document.getElementById('messageInput').focus();
            };
            emojiDiv.appendChild(btn);
        });
        document.body.appendChild(emojiDiv);
    };
    document.addEventListener('click', () => { if (emojiDiv) { emojiDiv.remove(); emojiDiv = null; } });
    
    document.getElementById('imageBtn').onclick = function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (file && file.size < 2 * 1024 * 1024) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    addMessage("📷 Image", true);
                };
                reader.readAsDataURL(file);
            } else {
                showToast("Image too large (max 2MB)");
            }
        };
        input.click();
    };
</script>
</body>
</html>
